<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Леркис</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            background: #e0e0e0;
            border: 4px solid #f4f7f6;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #1a1a1a;
        }
        .subtitle {
            color: #666;
            font-size: 1rem;
            margin-bottom: 25px;
            font-weight: 500;
        }
        p {
            margin-bottom: 25px;
            color: #444;
            font-size: 0.95rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .links a {
            display: block;
            padding: 12px 20px;
            background: #24292e;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s, transform 0.2s;
        }
        .links a:hover {
            background: #0366d6;
            transform: translateY(-2px);
        }
        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://via.placeholder.com/120" alt="Аватар" class="avatar">
        
        <h1>Леркис</h1>
        <div class="subtitle">Студент</div>
        
        <p>
            Привет! Это моя персональная страница. Добро пожаловать в мой цифровой мир.
        </p>
        
        <div class="links">
            <a href="https://github.com/lerkiscc" target="_blank">Мой GitHub</a>
            <a href="https://t.me/ваш-ник" target="_blank">Telegram</a>
            <a href="mailto:ваш@email.com">Написать на Email</a>
        </div>
        
        <footer>
            © 2026 Создано на GitHub Pages
        </footer>
    </div>
</body>
</html>
